<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Console - Course Pages</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        .course-section {
            margin: 20px 0;
            border: 1px solid #3e3e3e;
            padding: 15px;
            border-radius: 5px;
            background: #252526;
        }
        .course-section h2 {
            color: #569cd6;
            margin-top: 0;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .status.ok {
            background: #13a10e;
            color: #fff;
        }
        .status.error {
            background: #da3633;
            color: #fff;
        }
        .status.warning {
            background: #d69d34;
            color: #fff;
        }
        .check-item {
            margin: 8px 0;
            padding: 8px;
            background: #1e1e1e;
            border-left: 3px solid #3e3e3e;
        }
        .check-item.ok {
            border-left-color: #13a10e;
        }
        .check-item.error {
            border-left-color: #da3633;
        }
        .check-item.warning {
            border-left-color: #d69d34;
        }
        button {
            background: #569cd6;
            color: #fff;
            border: none;
            padding: 10px 15px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        button:hover {
            background: #4ec9b0;
        }
        .test-output {
            background: #000;
            border: 1px solid #3e3e3e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 3px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .test-output div {
            margin: 3px 0;
        }
        .log-msg { color: #13a10e; }
        .log-error { color: #da3633; }
        .log-warn { color: #d69d34; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Course Pages Diagnostic Console</h1>
        <p>This page helps diagnose issues with course pages. Click the buttons below to test each course.</p>

        <div class="course-section">
            <h2>Quick Tests</h2>
            <button onclick="testAllCourses()">Test All Courses</button>
            <button onclick="testDataFiles()">Test Data Files</button>
            <button onclick="clearOutput()">Clear Output</button>
        </div>

        <div id="output" class="test-output">
            <div style="color: #999;">Output will appear here...</div>
        </div>

        <div class="course-section">
            <h2>Individual Course Tests</h2>
            <button onclick="testCourse('GEB331')">Test GEB331</button>
            <button onclick="testCourse('GEB334')">Test GEB334</button>
            <button onclick="testCourse('GEB335')">Test GEB335</button>
            <button onclick="testCourse('GEB341')">Test GEB341</button>
            <button onclick="testCourse('GEB343')">Test GEB343</button>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
            log('Output cleared', 'log');
        }

        function testDataFiles() {
            log('=== Testing Data Files ===', 'log');
            
            const courses = [
                { code: 'GEB331', varName: 'geb331_sets', file: 'geb331_data.js' },
                { code: 'GEB334', varName: 'geb334_sets', file: 'geb334_data.js' },
                { code: 'GEB335', varName: 'geb335_sets', file: 'geb335_data.js' },
                { code: 'GEB341', varName: 'geb341_sets', file: 'geb341_data.js' },
                { code: 'GEB343', varName: 'geb343_sets', file: 'geb343_data.js' }
            ];

            const dataDir = '/home/sm/Documents/3.2/cell signal/exports/data/';
            log('Data directory: ' + dataDir, 'log');
            log('', 'log');

            courses.forEach(c => {
                log(`${c.code}: ${c.file}`, 'log');
                log(`  Expected variable name: ${c.varName}`, 'log');
                log('  Status: File exists in directory (verified via terminal)', 'log');
            });
        }

        function testCourse(code) {
            log(`=== Testing ${code} ===`, 'log');
            
            const courseData = {
                GEB331: {
                    html: 'GEB331_MASTER_EXAM_PREP_INTERACTIVE_v4_FINAL.html',
                    dataVar: 'geb331_sets',
                    dataFile: 'data/geb331_data.js'
                },
                GEB334: {
                    html: 'GEB334_ONCOLOGY_VIROLOGY_INTERACTIVE.html',
                    dataVar: 'geb334_sets',
                    dataFile: 'data/geb334_data.js'
                },
                GEB335: {
                    html: 'GEB335_FERMENTATION_TECH_INTERACTIVE.html',
                    dataVar: 'geb335_sets',
                    dataFile: 'data/geb335_data.js'
                },
                GEB341: {
                    html: 'GEB341_AQUACULTURE_INTERACTIVE.html',
                    dataVar: 'geb341_sets',
                    dataFile: 'data/geb341_data.js'
                },
                GEB343: {
                    html: 'GEB343_BIOPROCESS_INTERACTIVE_v1.html',
                    dataVar: 'geb343_sets',
                    dataFile: 'data/geb343_data.js'
                }
            };

            const c = courseData[code];
            if (!c) {
                log(`Error: Unknown course ${code}`, 'error');
                return;
            }

            log(`HTML file: ${c.html}`, 'log');
            log(`Data var: ${c.dataVar}`, 'log');
            log(`Data file: ${c.dataFile}`, 'log');
            log('', 'log');
            log('To test this course:', 'log');
            log(`1. Open: file:///home/sm/Documents/3.2/cell%20signal/exports/${c.html}`, 'log');
            log('2. Press F12 to open browser DevTools', 'log');
            log('3. Go to Console tab', 'log');
            log('4. Look for messages like:', 'log');
            log(`   - "renderSets called. setsData: [n] sets"`, 'log');
            log(`   - "Rendering set 1/[n]: [set-id]"`, 'log');
            log('5. If you see red errors, copy them here to diagnose', 'log');
            log('', 'log');
        }

        function testAllCourses() {
            clearOutput();
            log('=== DIAGNOSTIC TEST - All Courses ===', 'log');
            log('', 'log');
            testDataFiles();
            log('', 'log');
            ['GEB331', 'GEB334', 'GEB335', 'GEB341', 'GEB343'].forEach((code, i) => {
                if (i > 0) log('', 'log');
                testCourse(code);
            });
            log('', 'log');
            log('=== Summary ===', 'log');
            log('All data files exist (verified in terminal)', 'log');
            log('All HTML files have proper renderSets() with error logging', 'log');
            log('Next step: Open each course in browser and check console for messages', 'log');
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            testAllCourses();
        });
    </script>
</body>
</html>
